<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据管理系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="glass-card p-8 rounded-2xl w-full max-w-md mx-4 transition-all duration-300">
        <div class="text-center mb-8">
            <div class="bg-indigo-600 w-16 h-16 rounded-lg mx-auto mb-4 flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="浸9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">矩阵数据中心</h1>
            <p class="text-gray-500 text-sm mt-2">Matrix Data Management System</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">管理员账号</label>
                    <input type="text" required placeholder="请输入账号" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
                
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="block text-sm font-medium text-gray-700">安全密码</label>
                        <a href="#" class="text-xs text-indigo-600 hover:text-indigo-800">忘记密码？</a>
                    </div>
                    <input type="password" required placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-600">在此设备上记住我</label>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-md transition-all active:scale-95">
                    立即登录
                </button>
            </div>
        </form>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-400">© 2026 矩阵科技数据实验室. 保留所有权利。</p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            // 模拟登录加载状态
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> 身份验证中...';
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            setTimeout(() => {
                alert('登录成功！正在跳转至仪表盘...');
                // 实际项目中这里会使用 window.location.href = 'dashboard.html';
                btn.innerHTML = '验证成功';
                btn.classList.replace('bg-indigo-600', 'bg-green-500');
            }, 1500);
        }
    </script>
</body>
</html>
